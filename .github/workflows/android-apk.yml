name: Build OpenChess Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Android dependencies
        run: npm install --no-save --legacy-peer-deps @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor config for CI
        run: |
          mv capacitor.config.ts capacitor.config.ts.ci-backup
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sahmat.chess",
            "appName": "OpenChess",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "android": { "backgroundColor": "#262421" }
          }
          EOF

      - name: Initialize and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenChess-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
